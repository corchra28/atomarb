[package]
name = "gap-scan"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Cross-venue circuit scan using the three verified adapters. Read-only, no network."

[lib]
name = "gap_scan"
path = "src/lib.rs"

[[bin]]
name = "gap-scan"
path = "src/main.rs"

[dependencies]
jupiter-amm-interface = { git = "https://github.com/jup-ag/jupiter-amm-interface", branch = "main" }
jupiter-amm-test-kit = { git = "https://github.com/jup-ag/jupiter-amm-interface", branch = "main" }
raydium-cpmm-amm = { path = "../raydium_cpmm_amm" }
whirlpool-amm = { path = "../whirlpool_amm" }
meteora-dlmm-amm = { path = "../meteora_dlmm_amm" }
solana-account = "4"
solana-pubkey = { version = "4", features = ["curve25519"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
